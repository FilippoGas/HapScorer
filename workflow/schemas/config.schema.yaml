# workflow/schemas/config.schema.yaml

$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Validation schema for config.yaml"

type: object

properties:
  samples:
    type: string
    description: "Path to the TSV file containing the sample table."

  resources:
    type: object
    description: "Paths for external static reference resources and genetic maps."
    properties:
      genetic_maps_tar:
        type: string
        description: "Path to the bundled tarball containing per-chromosome genetic maps."
      genetic_maps_dir:
        type: string
        description: "Directory where extracted genetic maps are stored."

  # variant_processing:
  #   type: object
  #   description: "Processing parameters for genomic variants."

  phasing:
    type: object
    description: "Configuration for phasing pipeline steps."
    properties:
      phase_common_variants:
        type: object
        description: "Parameters for the phase_common rule."
        properties:
          filter_maf:
            type: number
            minimum: 0.0
            maximum: 0.5
            description: "MAF threshold for filtering target variants in SHAPEIT5."
            default: 0.001

  reference_data:
    type: object
    description: "Configuration settings for reference data retrieval."
    properties:
      ensembl_biomart:
        type: string
        description: "Ensembl BioMart database name."
      ensembl_dataset:
        type: string
        description: "Ensembl dataset identifier."
      ensembl_host:
        type: string
        description: "URL host for Ensembl Mart service or archive (can be found on the official Ensembl archives page: 'https://www.ensembl.org/help/articles/archives')."
      download_wt_sequences:
        type: object
        description: "Parameters specific to the download_wt_sequences rule."
        properties:
          transcript_biotype:
            type: string
            description: "Filter for target transcript biotype."
          filters:
            type: ["object", "null"]
            description: "Declarative filters applied to reference transcripts."
            properties:
              allowed_tsl:
                type: ["array", "null"]
                items:
                  type: string
                description: "List of permitted Transcript Support Levels (e.g., tsl1, tsl2)."
              excluded_chromosomes:
                type: ["array", "null"]
                items:
                  type: string
                description: "List of chromosome names to exclude (e.g., MT)."
              chromosome_regex:
                type: ["string", "null"]
                description: "Regular expression pattern for matching valid chromosome names."
          batch_size:
            type: integer
            minimum: 1
            description: "Number of transcripts per biomaRt query batch."
          sleep_delay:
            type: integer
            minimum: 0
            description: "Delay in seconds between biomaRt query batches."

# Top-level mandatory fields in config.yaml
required:
  - samples
  # - variant_processing
  # - phasing
  # - reference_data

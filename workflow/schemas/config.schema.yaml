# workflow/schemas/config.schema.yaml

$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Validation schema for config.yaml"

type: object

properties:
  samples:
    type: string
    description: "Path to the TSV file containing the sample table."

  variant_processing:
    type: object
    description: "Filtering and analysis parameters with BCFtools."
    properties:
      filter_variants:
        type: object
        description: "Parameters for the filter_variants rule."
        properties:
          vqsr_threshold:
            type: number
            minimum: 0.0
            maximum: 100.0
            default: 99.9
            description: "VQSR threshold as a percentage."
        required:
          - vqsr_threshold
    required:
      - filter_variants

# Top-level fields mandatory in config.yaml
required:
  - samples
  - variant_processing

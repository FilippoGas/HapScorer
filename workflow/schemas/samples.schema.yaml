# workflow/schemas/samples.schema.yaml

$schema: "https://json-schema.org/draft/2020-12/schema"
description: "JSON schema for validating the sample metadata TSV file in Snakemake."

type: "object"

properties:
  sample:
    type: "string"
    description: "Unique identifier for the biological sample."
    minLength: 1
    pattern: "^[a-zA-Z0-9_-]+$"

  var_type:
    type: "string"
    description: "Type of genomic variant (e.g., SNP or INDEL)."
    enum:
      - "snp"
      - "indel"
      - "SNPs"
      - "INDELs"
      - "SNP"
      - "INDEL"

  vcf_path:
    type: "string"
    description: "Relative or absolute file system path to the input raw VCF file."
    minLength: 1

# Top-level fields mandatory in samples.tsv
required:
  - "sample"
  - "var_type"
  - "vcf_path"

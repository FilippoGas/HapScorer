# .test/config/config.yaml

# ==============================================================================
# PIPELINE ANALYSIS CONFIGURATION
# ==============================================================================

# --- Input Files & Metadata ---
samples: "config/samples.tsv"
# resources:
#   genetic_maps_tar: "resources/genetic_maps.b38.tar.gz"
#   genetic_maps_dir: "resources/maps"

# --- Variant Processing Rules Configuration ---
# variant_processing:

# --- Phasing Rules Configuration ---
phasing:
  phase_common_variants:
    filter_maf: 0.01

# --- Reference Data Rules Configuration ---
reference_data:
  ensembl_biomart: "ENSEMBL_MART_ENSEMBL"
  ensembl_dataset: "hsapiens_gene_ensembl"
  ensembl_host: "https://oct2024.archive.ensembl.org"

  download_wt_sequences:
    transcript_biotype: "protein_coding"
    filters:
      allowed_tsl:
        - "tsl1"
        - "tsl2"
        - "tsl3"
      excluded_chromosomes:
        - "MT"
      chromosome_regex: "^\\d{1,2}$"
    batch_size: 1000
    sleep_delay: 2

# profiles/test/config.yaml

# ==============================================================================
# TEST EXECUTION PROFILE (CI/CD ENVIRONMENT) - PUBLIC REPO (4 Cores / 16GB)
# ==============================================================================

cores: 4
latency-wait: 15
use-conda: true
show-failed-logs: true

# Baseline resource allocations for test environment
default-resources:
  mem_mb: 3500
  runtime: 20

# Thread limits constrained to runner capacity
set-threads:
  # workflow/rules/variant_processing.smk
  concat_sample_variants: 4
  merge_and_sort_samples: 4

  # workflow/rules/phasing.smk
  split_vcf_by_chr: 4
  unpack_genetic_map: 1
  phase_common_variants: 4

  # workflow/rules/reference_data.smk
  download_ensembl_bulk_data: 1
  parse_ensembl_bulk_sequences: 1

# Memory and execution bounds per rule
set-resources:
  # workflow/rules/variant_processing.smk
  concat_sample_variants:
    mem_mb: 7500
    runtime: 30
  merge_and_sort_samples:
    mem_mb: 15000
    runtime: 30

  # workflow/rules/phasing.smk
  split_vcf_by_chr:
    mem_mb: 7500
    runtime: 30
  unpack_genetic_map:
    mem_mb: 3500
    runtime: 30
  phase_common_variants:
    mem_mb: 15000
    runtime: 60

  # workflow/rules/reference_data.smk
  download_ensembl_bulk_data:
    mem_mb: 4000
    runtime: 60
  parse_ensembl_bulk_sequences:
    mem_mb: 7500
    runtime: 60

# .github/workflows/main.yaml

name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Formatting
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_YAML_PRETTIER: true

  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: workflow/Snakefile
          args: "--lint"

  Testing:
    runs-on: ubuntu-latest
    needs:
      - Linting
      - Formatting
    steps:
      - uses: actions/checkout@v6

      - name: Test workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --conda-cleanup-pkgs cache --all-temp all_test"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools

      - name: Validate merge_and_sort_samples rule output
        run: |
          # Checking for file existence
          test -f ".test/results/variant_processing/merged/all_samples.vcf.gz"
          test -f ".test/expected/variant_processing/merged/all_samples.vcf.gz"

          # Comparison with the one in the expected directory
          diff -u \
            <(bcftools view -H .test/results/variant_processing/merged/all_samples.vcf.gz) \
            <(bcftools view -H .test/expected/variant_processing/merged/all_samples.vcf.gz)

      - name: Validate phase_common_variants rule output
        run: |
          for chr in chr3 chr6 chr8 chr21 chr22; do
            echo "Validating phased BCF output for ${chr}..."

            # Checking for file existence
            test -f ".test/results/phasing/phased/phased_${chr}.vcf.gz"
            test -f ".test/results/phasing/phased/phased_${chr}.vcf.gz.csi"

            # Comparison with the one in the expected directory
            diff -u \
              <(bcftools view -H .test/results/phasing/phased/phased_${chr}.vcf.gz) \
              <(bcftools view -H .test/expected/phasing/phased/phased_${chr}.vcf.gz)
          done

      - name: Test report
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --report report.zip"

# .github/workflows/main.yaml

name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Formatting
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_YAML_PRETTIER: true

  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: workflow/Snakefile
          args: "--lint"

  Testing:
    runs-on: ubuntu-latest
    needs:
      - Linting
      - Formatting
    steps:
      - uses: actions/checkout@v6

      - name: Test workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --conda-cleanup-pkgs cache --all-temp"

      - name: Validate merge_and_sort_samples rule output
        run: |
          # Decompress and compare VCF content using native zgrep to avoid host dependency issues
          diff -u \
            <(zgrep -v '^##bcftools' .test/results/merged/all_samples.vcf.gz | zgrep -v '^##fileDate') \
            <(zgrep -v '^##bcftools' .test/expected/merged/all_samples.vcf.gz | zgrep -v '^##fileDate')

      - name: Test report
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --report report.zip"

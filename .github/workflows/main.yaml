# .github/workflows/main.yaml

name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Formatting
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_YAML_PRETTIER: true

  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: workflow/Snakefile
          args: "--lint"

  Testing:
    runs-on: ubuntu-latest
    needs:
      - Linting
      - Formatting
    steps:
      - uses: actions/checkout@v6

      - name: Test workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --conda-cleanup-pkgs cache --all-temp all_test"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools

      - name: Validate merged cohort VCF concordance
        run: |
          echo "Evaluating genomic variant concordance for merged cohort VCF..."

          # Checking for file existence
          test -f ".test/results/variant_processing/merged/all_samples.vcf.gz"
          test -f ".test/expected/variant_processing/merged/all_samples.vcf.gz"

          # Intersect merged cohort output and reference VCF files and assert zero dataset-exclusive variants
          bcftools isec -p "isec_merged" ".test/results/variant_processing/merged/all_samples.vcf.gz" ".test/expected/variant_processing/merged/all_samples.vcf.gz"
          [ $(bcftools view -H "isec_merged/0000.vcf" | wc -l) -eq 0 ] && [ $(bcftools view -H "isec_merged/0001.vcf" | wc -l) -eq 0 ]
          rm -rf "isec_merged"

      - name: Validate phased VCF concordance
        run: |
          for chr in chr3 chr6 chr8 chr21 chr22; do
            echo "Evaluating genomic variant concordance for chromosome ${chr}..."

            # Checking for file existence
            test -f ".test/results/phasing/phased/phased_${chr}.vcf.gz"
            test -f ".test/results/phasing/phased/phased_${chr}.vcf.gz.csi"

            # Intersect output and reference compressed VCF files and assert zero dataset-exclusive variants
            bcftools isec -p "isec_${chr}" ".test/results/phasing/phased/phased_${chr}.vcf.gz" ".test/expected/phasing/phased/phased_${chr}.vcf.gz"
            [ $(bcftools view -H "isec_${chr}/0000.vcf" | wc -l) -eq 0 ] && [ $(bcftools view -H "isec_${chr}/0001.vcf" | wc -l) -eq 0 ]
            rm -rf "isec_${chr}"
          done

      - name: Test report
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --report report.zip"

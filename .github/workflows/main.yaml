# .github/workflows/main.yaml

name: Tests
on:
  push:
    branches: [main]
  pull_request:
    # branches: [main]

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Formatting
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_SNAKEMAKE_SNAKEFMT: true
          VALIDATE_YAML_PRETTIER: true

  Linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: workflow/Snakefile
          args: "--lint"

  Testing:
    runs-on: ubuntu-latest
    needs:
      - Linting
      - Formatting
    steps:
      - uses: actions/checkout@v6

      - name: Test workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --conda-cleanup-pkgs cache --all-temp --retries 5 all_test"

      - name: Set up Conda Environment for Variant Validation
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: workflow/envs/variant_processing.yaml
          activate-environment: variant_processing
          auto-activate-base: false

      - name: Validate merged cohort VCF concordance
        shell: bash -el {0}
        run: |
          bash .github/scripts/validate_vcf.sh \
            ".test/results/variant_processing/merged/all_samples.vcf.gz" \
            ".test/expected/variant_processing/merged/all_samples.vcf.gz" \
            "merged_cohort"

      - name: Validate phased VCF concordance
        shell: bash -el {0}
        run: |
          for chr in chr3 chr6 chr8 chr21 chr22; do
            # Assert index existence prior to validation
            test -f ".test/results/phasing/phased/${chr}.phased.vcf.gz.csi" || { echo "Missing .csi index for ${chr}"; exit 1; }

            bash .github/scripts/validate_vcf.sh \
              ".test/results/phasing/phased/${chr}.phased.vcf.gz" \
              ".test/expected/phasing/phased/${chr}.phased.vcf.gz" \
              "phased_${chr}"
          done

      - name: Set up Conda Environment for Reference Data Validation
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: workflow/envs/reference_data.yaml
          activate-environment: reference_data
          auto-activate-base: false

      - name: Validate Generated Reference Data
        shell: bash -el {0}
        run: |
          python .github/scripts/validate_reference_data.py .test

      - name: Set up Conda Environment for Haplotype Sequences Validation
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: workflow/envs/haplotype_sequences.yaml
          activate-environment: haplotype_sequences
          auto-activate-base: false

      - name: Validate Generated Haplotypes and Genotypes
        shell: bash -el {0}
        run: |
          python .github/scripts/validate_haplotypes.py .test

      - name: Test report
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .test
          snakefile: workflow/Snakefile
          args: "--profile profiles/test --report report.zip"
